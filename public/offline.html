<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TERRA — Offline</title>
  <style>
    :root {
      --soil-950: #0A0F0C;
      --soil-900: #101713;
      --soil-800: #17211B;
      --line: #2E3E35;
      --bone: #EEE9DA;
      --lichen: #8FA095;
      --sprout: #B8F53C;
      --ember: #EB5A3C;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--soil-950);
      color: var(--bone);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .card {
      background: var(--soil-900);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .badge {
      display: inline-block;
      background: rgba(235, 90, 60, 0.15);
      color: var(--ember);
      border: 1px solid var(--ember);
      font-family: monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 4px 12px;
      margin-bottom: 20px;
      border-radius: 2px;
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      color: var(--bone);
    }

    p {
      color: var(--lichen);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn {
      background: var(--sprout);
      color: var(--soil-950);
      border: none;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
      padding: 14px 24px;
      width: 100%;
      min-height: 48px;
      border-radius: 3px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="badge">NO SIGNAL</div>
    <h1>TERRA works offline once installed</h1>
    <p>The network connection is currently unavailable. If TERRA was previously opened or installed, the application
      cache will load automatically.</p>
    <button class="btn" onclick="window.location.reload()">RETRY CONNECTION</button>
  </div>
</body>

</html>
